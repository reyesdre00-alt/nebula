name: Compilar Nebula para Linux

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Obteniendo código y submódulos
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Instalando herramientas en la nube
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake git ninja-build libsdl2-dev libglew-dev

    - name: Clonar dependencias y parchear conflictos
      run: |
        mkdir -p deps host-tools
        git clone --depth 1 https://github.com/KhronosGroup/Glslang.git deps/glslang-src

        # Parche 1: Forzar ENABLE_OPT=0 en glslang para que no busque SPIR-V tools
        sed -i 's/option(ENABLE_OPT "Enable SPIRV-Optimizer" ON)/option(ENABLE_OPT "Enable SPIRV-Optimizer" OFF)/g' deps/glslang-src/CMakeLists.txt || true
        sed -i 's/set(ENABLE_OPT ON)/set(ENABLE_OPT OFF)/g' deps/glslang-src/CMakeLists.txt || true

        # Parche 2: Evitar que libarchive intente escribir en la ruta prohibida /pkgconfig
        find . -name "archive_deps.cmake" -exec sed -i 's|DESTINATION /pkgconfig|DESTINATION lib/pkgconfig|g' {} + || true
        find . -name "*.cmake" -exec sed -i 's|DESTINATION /pkgconfig|DESTINATION lib/pkgconfig|g' {} + || true

    - name: Compilando binario
      run: |
        mkdir -p build
        cd build
        cmake ../platform/sdl -G Ninja \
          -DNEBULA_DEPS=../deps \
          -DNEBULA_HOST_TOOLS=../host-tools \
          -DCMAKE_INSTALL_PREFIX=$(pwd)/install
        ninja

    - name: Empaquetando ejecutable
      uses: actions/upload-artifact@v4
      with:
        name: nebula-linux-x86_64
        path: build/
