name: Compilar Nebula para Linux

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Obteniendo código y submódulos
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Instalando herramientas en la nube
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake git ninja-build libsdl2-dev libglew-dev

    - name: Clonar dependencias requeridas
      run: |
        mkdir -p deps host-tools
        git clone --depth 1 https://github.com/KhronosGroup/Glslang.git deps/glslang-src

    - name: Compilando binario
      run: |
        mkdir -p build
        cd build
        # Configuramos CMake desactivando el optimizador de glslang y aislando la ruta de instalación
        cmake ../platform/sdl -G Ninja \
          -DNEBULA_DEPS=../deps \
          -DNEBULA_HOST_TOOLS=../host-tools \
          -DENABLE_OPT=0 \
          -DCMAKE_INSTALL_PREFIX=$(pwd)/install
        ninja

    - name: Empaquetando ejecutable
      uses: actions/upload-artifact@v4
      with:
        name: nebula-linux-x86_64
        path: build/
