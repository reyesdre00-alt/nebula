name: Compilar Nebula para Linux

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Obteniendo código y submódulos
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Instalando herramientas y librerías gráficas en la nube
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential cmake git ninja-build \
          libglew-dev libarchive-dev \
          libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
          libxcursor-dev libxi-dev libxxf86vm-dev libwayland-dev \
          libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev

    - name: Clonar dependencias requeridas (Glslang y SDL3)
      run: |
        mkdir -p deps host-tools
        git clone --depth 1 https://github.com/KhronosGroup/Glslang.git deps/glslang-src
        git clone --depth 1 --branch release-3.4.18 https://github.com/libsdl-org/SDL.git deps/SDL3-3.4.18 || \
        git clone --depth 1 https://github.com/libsdl-org/SDL.git deps/SDL3-3.4.18

        # Neutralizamos el archive_deps conflictivo
        echo "# Desactivado para Linux" > cmake/archive_deps.cmake

    - name: Compilando binario
      run: |
        mkdir -p build
        cd build
        cmake ../platform/sdl -G Ninja \
          -DNEBULA_DEPS=../deps \
          -DNEBULA_HOST_TOOLS=../host-tools \
          -DALLOW_EXTERNAL_SPIRV_TOOLS=ON \
          -DCMAKE_INSTALL_PREFIX=$(pwd)/install
        ninja

    - name: Empaquetando ejecutable
      uses: actions/upload-artifact@v4
      with:
        name: nebula-linux-x86_64
        path: build/
