name: Compilar Nebula para Linux

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Obteniendo código y submódulos
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Instalando herramientas en la nube
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake git ninja-build libsdl2-dev libglew-dev

    - name: Preparar dependencias y herramientas host faltantes
      run: |
        # Creamos las carpetas de dependencias que exige el CMakeLists.txt raíz
        mkdir -p deps/glslang-src host-tools
        
        # Clonamos una versión compatible de glslang para evitar el error de add_subdirectory
        git clone --depth 1 https://github.com/KhronosGroup/Glslang.git deps/glslang-src

    - name: Compilando binario
      run: |
        mkdir -p build
        cd build
        cmake ../platform/sdl -G Ninja -DNEBULA_HOST_TOOLS=../host-tools
        ninja

    - name: Empaquetando ejecutable
      uses: actions/upload-artifact@v4
      with:
        name: nebula-linux-x86_64
        path: build/
