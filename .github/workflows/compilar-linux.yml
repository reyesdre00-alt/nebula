name: Compilar Nebula para Linux

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Obteniendo código y submódulos
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Instalando herramientas en la nube
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake git ninja-build libsdl2-dev libglew-dev

    - name: Clonar dependencias y parchear archivo de libarchive
      run: |
        mkdir -p deps host-tools
        git clone --depth 1 https://github.com/KhronosGroup/Glslang.git deps/glslang-src

        # Solución radical: reemplazamos la línea conflictiva de pkgconfig directamente en el archivo
        python3 -c "
        path = 'cmake/archive_deps.cmake'
        with open(path, 'r') as f:
            content = f.read()
        # Reemplazamos cualquier destino que apunte a la raíz por una ruta local dentro de build
        new_content = content.replace('DESTINATION /pkgconfig', 'DESTINATION lib/pkgconfig')
        new_content = new_content.replace('DESTINATION pkgconfig', 'DESTINATION lib/pkgconfig')
        with open(path, 'w') as f:
            f.write(new_content)
        print('Archivo archive_deps.cmake parcheado exitosamente.')
        "

    - name: Compilando binario
      run: |
        mkdir -p build
        cd build
        cmake ../platform/sdl -G Ninja \
          -DNEBULA_DEPS=../deps \
          -DNEBULA_HOST_TOOLS=../host-tools \
          -DALLOW_EXTERNAL_SPIRV_TOOLS=ON \
          -DCMAKE_INSTALL_PREFIX=$(pwd)/install
        ninja

    - name: Empaquetando ejecutable
      uses: actions/upload-artifact@v4
      with:
        name: nebula-linux-x86_64
        path: build/
